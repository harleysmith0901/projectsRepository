<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Harley's HTML Homepage</title>

    <link rel="stylesheet" href="./stylesheet.css">

</head>
<body>

    <!-- Main Top Button -->
    <div class="marginTop50px">
    <div class="marginWidthRatio-1-2-1">
        <button command="show-modal" commandFor="mainDialog">
            <div class="standardGreenBackground">
                <h1 class="font">
                    Harley's HTML Webpage
                </h1>
                <div class="width50vw"></div>
            </div>
        </button>
    </div>
    </div>

    <!-- Separator -->
    <div class="separator"></div>

    <!-- Python Projects -->
    <div class="marginTop50px">
    <div class="marginWidthRatio-1-2-1">
        <button command="show-modal" commandFor="pythonDialog">
            <div class="standardGreenBackground">
                <h1 class="font">
                    Python Projects
                </h1>
                <div class="width50vw"></div>
            </div>
        </button>
    </div>
    </div>


    <!-- Dialogues -->
    <dialog id="mainDialog">

        <div class="marginTop50px">
        <div class="dialogMargin">
            <button command="close" commandFor="mainDialog">
                <div class="redBackground">
                    <h1 class="font">
                        Exit
                    </h1>
                    <div class="width50vw"></div>
                </div>
            </button>
        </div>
        </div>

        <div class="marginTop50px">
        <div class="dialogMargin">
            <button command="show-modal" commandFor="patchDialog">
                <div class="standardGreenBackground">
                    <h1 class="font">
                        Patch Notes
                    </h1>
                    <div class="width50vw"></div>
                </div>
            </button>
        </div>
        </div>

        <div class="marginTop50px">
        <div class="dialogMargin">
            <button command="show-modal" commandFor="suggestionDialog">
                <div class="standardGreenBackground">
                    <h1 class="font">
                        Suggestion Box
                    </h1>
                    <div class="width50vw"></div>
                </div>
            </button>
        </div>
        </div>

        <div class="marginTop50px">
        <div class="marginBottom50px">
        <div class="dialogMargin">
            <div class="width50vw">
                <div class="standardGreenBackground">
                    <h1 class="font">
                        <a href="./betterWebsite.zip">
                            .ZIP File Download
                        </a>
                    </h1>
                    <div class="width50vw"></div>
                </div>
            </div>
        </div>
        </div>
        </div>

    </dialog>






</body>
</html>
